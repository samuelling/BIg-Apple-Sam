# XcodeGen spec for the macOS screen saver. CI runs `xcodegen generate` in this folder.
name: BigAppleSam
options:
  bundleIdPrefix: com.samuelling
  deploymentTarget:
    macOS: "12.0"
targets:
  BigAppleSam:
    type: bundle
    platform: macOS
    sources:
      - path: Sources
      - path: ../index.html
        buildPhase: resources
      - path: Resources
        buildPhase: resources
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_NAME: "Big Apple Sam"
        PRODUCT_MODULE_NAME: BigAppleSam
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelling.BigAppleSam
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        ARCHS: "$(ARCHS_STANDARD)"
        ONLY_ACTIVE_ARCH: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
